name: lightgbm
seed: 42
data:
  data_dir: benchmark/data
  annotations: benchmark/labels.csv
  reference_quality: ai_reference
  split_strategy: stratified
  splits_file: benchmark/splits.json
model:
  kind: lightgbm
  params:
    n_estimators: 100
    num_leaves: 15
    learning_rate: 0.05
threshold: 0.5
fn_cost_ratios: [1, 2, 5, 10]
